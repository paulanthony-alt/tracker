# Sends Vyro push notifications every 10 minutes. Free: GitHub Actions minutes
# are unlimited for public repositories.
#
# This repository is public, so these run logs are public too. The sender only
# logs counts and times, never reminder titles or device names.
#
# Setup: README → Notifications. Scheduled runs happen on the default branch
# (main). GitHub pauses schedules in public repos after 60 days without commits;
# if reminders stop, re-enable it under Actions → Vyro reminders.
# Test anytime with Actions → "Vyro reminders" → Run workflow.
name: Vyro reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vyro-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shared
            scripts/reminders
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/reminders/package-lock.json
      - run: npm ci --prefix scripts/reminders
      - run: node scripts/reminders/send.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LOOKAHEAD_MINUTES: '10'
